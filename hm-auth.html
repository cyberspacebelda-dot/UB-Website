<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#125430" />
  <title>Health Mitra Login | UB AYURVED</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f1f5f9}.brand{background:#125430}</style>
</head>
<body class="min-h-screen p-3 sm:p-6">
  <main class="max-w-xl mx-auto space-y-4">
    <header class="brand text-white rounded-2xl p-5 shadow">
      <div class="text-xs font-bold tracking-widest text-emerald-100">UB AYURVED DRUGS & PHARMACY</div>
      <h1 class="text-2xl font-black mt-2">Health Mitra Portal</h1>
      <p class="text-sm text-emerald-100 mt-1">Phone OTP login • Super Admin approval</p>
    </header>

    <section id="authCard" class="bg-white rounded-2xl p-5 shadow space-y-4">
      <div class="flex gap-2">
        <button id="loginTab" class="flex-1 rounded-xl p-2 font-bold bg-emerald-100 text-emerald-900">Login</button>
        <button id="registerTab" class="flex-1 rounded-xl p-2 font-bold bg-slate-100">New Registration</button>
      </div>
      <div id="loginPanel" class="space-y-3">
        <h2 class="font-extrabold text-lg">Login with mobile OTP</h2>
        <input id="loginPhone" type="tel" autocomplete="tel" placeholder="+919876543210" class="w-full border rounded-xl p-3" />
      </div>
      <div id="registerPanel" class="hidden space-y-3">
        <h2 class="font-extrabold text-lg">New Health Mitra Registration</h2>
        <input id="regName" maxlength="120" placeholder="Full name" class="w-full border rounded-xl p-3" />
        <input id="regPhone" type="tel" autocomplete="tel" placeholder="Mobile number (+91...)" class="w-full border rounded-xl p-3" />
        <input id="regAddress" maxlength="300" placeholder="Address / GP / Pincode" class="w-full border rounded-xl p-3" />
        <input id="regSponsor" maxlength="30" placeholder="Sponsor HM Code (optional)" class="w-full border rounded-xl p-3 uppercase" />
        <select id="regRank" class="w-full border rounded-xl p-3">
          <option value="HM1">HM1</option><option value="HM2">HM2</option><option value="HM3">HM3</option>
          <option value="MR">MR</option><option value="SR">SR</option><option value="SE">SE</option>
          <option value="SO">SO</option><option value="TSM">TSM</option><option value="ASM">ASM</option><option value="RSM">RSM</option>
        </select>
      </div>
      <div id="recaptcha-container"></div>
      <button id="sendOtp" class="w-full brand text-white rounded-xl p-3 font-extrabold">Send OTP</button>
      <div id="otpPanel" class="hidden space-y-2">
        <input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit OTP" class="w-full border rounded-xl p-3 tracking-widest" />
        <button id="verifyOtp" class="w-full bg-blue-700 text-white rounded-xl p-3 font-extrabold">Verify OTP & Continue</button>
      </div>
      <p id="message" role="status" class="text-sm text-slate-700"></p>
      <button id="logout" class="hidden w-full bg-slate-100 rounded-xl p-2 font-bold">Sign out</button>
    </section>

    <section id="hmStatus" class="hidden bg-white rounded-2xl p-5 shadow space-y-2">
      <h2 class="font-extrabold text-lg">Your account status</h2>
      <div id="hmStatusText" class="text-sm"></div>
    </section>

    <section id="adminPanel" class="hidden bg-white rounded-2xl p-5 shadow space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-extrabold text-lg">Super Admin • HM Approval</h2>
        <button id="adminRefresh" class="text-sm font-bold text-blue-700">Refresh</button>
      </div>
      <div id="pendingList" class="space-y-3 text-sm"></div>
    </section>
    <a href="./index.html" class="block text-center text-sm text-emerald-800 font-bold">← Back to UB AYURVED Website</a>
    <p class="text-xs text-slate-500 text-center">Never share your OTP. HM Code is an identifier, not a password.</p>
  </main>
  <script type="module" src="./hm-auth.js"></script>
</body>
</html>
